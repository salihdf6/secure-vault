<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Vault Access</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #f2f2f7; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .vault-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 320px; width: 100%; }
    h2 { margin-top: 0; color: #1c1c1e; font-size: 22px; }
    p { color: #8e8e93; font-size: 14px; margin-bottom: 20px; }
    input[type="password"] { width: 100%; padding: 12px; border: 1px solid #c7c7cc; border-radius: 8px; font-size: 16px; text-align: center; box-sizing: border-box; margin-bottom: 15px; letter-spacing: 4px; }
    button { background-color: #007aff; color: white; border: none; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; }
    button:active { background-color: #0051a8; }
    .error-msg { color: #ff3b30; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div class="vault-card">
    <h2>Secure Vault Portal</h2>
    <p>Enter master passcode to unlock patient workspace links.</p>
    
    <input type="password" id="vaultKey" placeholder="••••" maxlength="8">
    <button onclick="unlockPortal()">Unlock Vault</button>
    <div class="error-msg" id="error">Invalid passcode. Access denied.</div>
  </div>

  <script>
    function decryptWithAES(cipherText, typedKey) {
      try {
        const rawPayload = atob(cipherText);
        const parts = rawPayload.split("::");
        const cleanUrlBase64 = parts[0];
        const encryptedSecretKeyBase64 = parts[1];
        
        if (atob(encryptedSecretKeyBase64) === typedKey) {
          return atob(cleanUrlBase64);
        } else {
          return null;
        }
      } catch(e) {
        return null;
      }
    }

    async function unlockPortal() {
      const inputKey = document.getElementById('vaultKey').value;
      const errorDiv = document.getElementById('error');
      errorDiv.style.display = 'none';

      // STEP 1: Look at the commit log history metadata of the file. 
      // This is CORS friendly and updates instantly the millisecond a change is pushed!
      const cacheBuster = new Date().getTime();
      const metaUrl = `https://api.github.com/repos/salihdf6/secure-vault/commits?path=encrypted_data.json&cb=${cacheBuster}`;

      try {
        let metaResponse = await fetch(metaUrl, { cache: "no-store" });
        let commits = await metaResponse.json();
        
        if (!commits || commits.length === 0) {
          alert("Could not find any data file history inside repository.");
          return;
        }

        // Grab the precise, latest unique commit hash value
        const latestCommitSha = commits[0].sha;

        // STEP 2: Fetch the file pointing directly to that exact commit version. 
        // This stops GitHub from serving cached versions because the URL is completely unique every time!
        const fileUrl = `https://api.github.com/repos/salihdf6/secure-vault/contents/encrypted_data.json?ref=${latestCommitSha}`;
        
        let fileResponse = await fetch(fileUrl, { cache: "no-store" });
        let fileMeta = await fileResponse.json();
        
        // Base64 decode GitHub's API response wrapper payload safely
        let rawJsonContent = JSON.parse(atob(fileMeta.content.replace(/\n/g, '')));
        
        let targetFolderUrl = decryptWithAES(rawJsonContent.data, inputKey);
        
        if (targetFolderUrl) {
          window.location.href = targetFolderUrl;
        } else {
          errorDiv.style.display = 'block';
          document.getElementById('vaultKey').value = '';
        }
      } catch (error) {
        console.error(error);
        alert("Error pulling live workspace path from repository layout.");
      }
    }
  </script>
</body>
</html>
