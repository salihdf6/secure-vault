<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Vault</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 90%; }
        h2 { color: #1d1d1f; margin-bottom: 10px; }
        p { color: #86868b; font-size: 14px; margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #0071e3; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 500; }
        .error { color: #ff3b30; margin-top: 10px; font-size: 14px; display: none; }
        .loading { display: none; color: #0071e3; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <h2>Secure Link Vault</h2>
    <p>This folder link is encrypted. Enter the master key to redirect.</p>
    <div id="auth-form">
        <input type="password" id="password-input" placeholder="Enter Password" autofocus>
        <button onclick="decryptAndRedirect()">Access Folder</button>
        <p id="error-message" class="error">Incorrect password or invalid data.</p>
    </div>
    <div id="loading-message" class="loading">Decrypting and redirecting...</div>
</div>
<script>
    const ENCRYPTED_JSON_URL = "encrypted_data.json"; 
    async function decryptAndRedirect() {
        const password = document.getElementById("password-input").value;
        const errorEl = document.getElementById("error-message");
        const formEl = document.getElementById("auth-form");
        const loadingEl = document.getElementById("loading-message");
        if (!password) return;
        errorEl.style.display = "none";
        try {
            const response = await fetch(ENCRYPTED_JSON_URL + '?t=' + new Date().getTime());
            if (!response.ok) throw new Error("Could not load encrypted data.");
            const payload = await response.json();
            const encryptedString = payload.data;
            const bytes = CryptoJS.AES.decrypt(encryptedString, password);
            const decryptedUrl = bytes.toString(CryptoJS.enc.Utf8);
            if (decryptedUrl && decryptedUrl.startsWith("http")) {
                formEl.style.display = "none";
                loadingEl.style.display = "block";
                window.location.href = decryptedUrl;
            } else { throw new Error("Invalid decryption."); }
        } catch (error) { errorEl.style.display = "block"; }
    }
    document.getElementById("password-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") decryptAndRedirect();
    });
</script>
</body>
</html>
