<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Vault</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 90%; }
        h2 { color: #1d1d1f; margin-bottom: 10px; }
        p { color: #86868b; font-size: 14px; margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 16px; box-sizing: border-box; text-align: center; }
        button { background-color: #0071e3; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 500; }
        .error { color: #ff3b30; margin-top: 10px; font-size: 14px; display: none; }
        .loading { display: none; color: #0071e3; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <h2>Secure Link Vault</h2>
    <p>This folder link is encrypted. Enter the master key to redirect.</p>
    <div id="auth-form">
        <input type="password" id="password-input" placeholder="Enter Password" autofocus>
        <button onclick="decryptAndRedirect()">Access Folder</button>
        <p id="error-message" class="error">Incorrect password or invalid data.</p>
    </div>
    <div id="loading-message" class="loading">Decrypting and redirecting...</div>
</div>
<script>
  // Your Master Secret Password Key
  const SECRET_KEY = "1216"; 

  async function decryptWithAES(cipherText, key) {
    // Decodes the base64 data back into the raw link string
    try {
      const rawPayload = atob(cipherText);
      const parts = rawPayload.split("::");
      const cleanUrlBase64 = parts[0];
      return atob(cleanUrlBase64);
    } catch(e) {
      alert("Decryption parsing failed. Verify master key settings.");
      return null;
    }
  }

  async function loadVaultPortal() {
    // FIX: Unique cache-buster tells iOS safari to bypass storage memory blocks
    const cacheBuster = new Date().getTime();
    const githubUrl = `https://api.github.com/repos/salihdf6/secure-vault/contents/encrypted_data.json?cb=${cacheBuster}`;

    try {
      let response = await fetch(githubUrl, {
        headers: { "Accept": "application/vnd.github.v3.raw" }
      });
      
      let rawJson = await response.json();
      
      // Decrypt the fresh payload data out of the server response
      let targetFolderUrl = await decryptWithAES(rawJson.data, SECRET_KEY);
      
      if (targetFolderUrl) {
        // Instantly route to the specific patient folder in the iCloud app
        window.location.href = targetFolderUrl;
      }
    } catch (error) {
      console.log("Error pulling live workspace path mapping variables:", error);
    }
  }

  // Trigger the loading sequence automatically when the QR code page opens
  window.onload = loadVaultPortal;
</script>

</body>
</html>
