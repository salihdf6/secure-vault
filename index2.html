<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background-color: #f2f2f7; padding: 20px; }
    .form-card { background: #fff; padding: 20px; border-radius: 12px; max-width: 600px; margin: 0 auto; }
    input, textarea { width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { background-color: #007aff; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="form-card">
    <h2>New Cloud Patient Entry</h2>
    <input type="text" id="pName" placeholder="Patient Name">
    <input type="text" id="pFileNo" placeholder="File No.">
    <textarea id="pOpNotes" placeholder="Operative Notes"></textarea>
    <button onclick="saveData()">Save to Database</button>
    <p id="status"></p>
  </div>

  <script>
    // Initialize Supabase
    // Replace the values inside the quotes with your actual keys from the screenshot
const supabase = supabase.createClient(
  'https://otrtkhzaojqodpmeuelb.supabase.co', 
  'sb_publishable_Kgn_Uir2uPco2gJ_X34CvQ_XMIrOZoy'
);


    async function saveData() {
      document.getElementById('status').innerText = "Saving...";
      
      const { error } = await supabase.from('patients').insert([
        { 
          name: document.getElementById('pName').value,
          file_no: document.getElementById('pFileNo').value,
          op_notes: document.getElementById('pOpNotes').value
        }
      ]);

      if (error) {
        document.getElementById('status').innerText = "Error: " + error.message;
      } else {
        document.getElementById('status').innerText = "✅ Saved Successfully!";
      }
    }
  </script>
</body>
</html>
